schema: spec-driven

context: |
  项目名称：KnowStruct。

  默认上下文按以下顺序读取：
  1. AGENTS.md
  2. docs/项目上下文与文档路由.md
  3. 与当前需求相关的 openspec/specs/ 主规格

  不要默认全文读取三份长产品文档。仅在短上下文的路由表指向相关章节、
  当前需求需要细节或发现冲突时，按需读取对应章节。归档 Change 只用于追溯历史理由。

  产品定位：把截图、链接、文字和文件等零散经验，通过 AI 辅助处理与人工确认，
  沉淀为可维护、可检索、可审查、可追溯的结构化知识与决策。

  当前聚焦知识采集与整理：P0 闭环（登录 -> 项目与目录 -> 文字采集 -> 图片 OCR
  -> 提取确认 -> 搜索与来源追溯）与 P1 Review 已完成。
  决策、预算/花费、PDF/网页正文解析（合同/报价类）、装修目录模板、项目首页概览
  因使用场景少、复杂度高（或与现有页面重叠）暂缓（2026-08-07、2026-08-09 决定）；
  不得顺带实现注册、协作等未授权的 P1-P3 能力。

  长期约束：
  - AI 只能生成待确认候选内容，不得直接覆盖正式知识记录。
  - Source、Processing Task、Extraction、Entry、Decision 必须分层保存。
  - 正式知识记录必须支持来源追溯。
  - P0 使用普通知识目录树，不引入图数据库。
  - 移动端优先采集，桌面端优先整理。
  - 移动端和桌面端是同一个响应式 Web App，共用后端和认证会话。
  - 业务数据必须归属当前认证用户的 Workspace。
  - 涉及全局导航、核心对象、产品范围或技术栈时，按文档路由检查详细基线。

rules:
  proposal:
    - 明确用户问题、Appetite、本次包含和 Non-Goals，避免扩大到后续优先级。
    - 说明依赖的现有主规格和需要按需读取的详细文档章节。
  design:
    - 明确数据归属、迁移、失败与重试、桌面/移动差异和安全边界。
    - 涉及 AI 时必须保留候选与正式记录的人工确认边界。
  specs:
    - 场景必须可验证，并覆盖正常、空、失败以及需要时的重试行为。
  tasks:
    - 包含相关自动化测试、真实验收、文档同步和 OpenSpec 归档检查。
